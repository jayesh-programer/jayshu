{% extends 'base.html' %}

{% block title %}Page Not Found (404) | ApexStore{% endblock %}

{% block content %}
<div class="container" style="max-width:600px; text-align:center; padding:4rem 1rem;">
  <div style="font-size:4rem; font-weight:800; color:#2563eb; margin-bottom:0.5rem;">404</div>
  <h1 style="font-size:1.75rem; font-weight:800; color:#0f172a; margin-bottom:1rem;">Page Not Found</h1>
  <p style="color:#64748b; line-height:1.6; margin-bottom:2rem;">
    The page or product you were searching for might have been moved, renamed, or is temporarily unavailable.
  </p>
  <div style="display:flex; justify-content:center; gap:1rem;">
    <a href="{% url 'catalog:home' %}" class="btn btn-primary">Return to Storefront</a>
    <a href="{% url 'catalog:product_list' %}" class="btn btn-secondary">Browse All Products</a>
  </div>
</div>
{% endblock %}
